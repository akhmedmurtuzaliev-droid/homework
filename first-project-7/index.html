<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <title>LEADER CLASSIC</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <div class="header__logo">
          <a class="logo header__logo" href="#">
            <img
              class="header__logo-logo"
              src="./icons/header-logo.svg"
              alt="логотип leader classic"
              width="52"
              height="66"
            />
          </a>
          <h2 class="header__logo-title">
            LEADER <br />
            CLASSIC
          </h2>
        </div>
        <div class="header__lang">
          <img
            class="header__lang-flag"
            src="./icons/header-language.svg"
            alt="выбор языка"
          />
          <span class="header__lang-title">RU</span>
          <svg width="22" height="22">
            <use
              class="header__lang-icon"
              href="./icons/header__lang-icon.svg#lang-icon"
            ></use>
          </svg>
        </div>
        <div class="menu">
            <nav class="header__menu"
            id="header__menu"
            aria-label="главное меню">
          <ul class="menu__list">
            <li class="menu__item">Тарифы</li>
            <li class="menu__item">Бонус</li>
            <li class="menu__item">Реферальная</li>
            <li class="menu__item menu__item-accent1">Контакты</li>
          </ul>
          </nav>
        </div>
        <div class="header__button">
          <a class="button__ent" href="#">Войти</a>
          <a class="button__open" href="#">Открыть счет</a>
        </div>
      </div>
      </div>
    </header>
    <main class="container">
      <div class="promo__bunner">
        <span class="gift">🎁</span>
        <div class="gift__title">
          <h4 class="title">Станьте миллионером с Leader Classic</h4>
          <p class="title__p">Откройте счет, инвестируйте в фонды Leader Classic и получите шанс выиграть один из 100 000 000 </p>
        </div>
        <div class="time" id="time">00д : 00ч : 00с</div>
      </div>
      </div>
    </main>
  </body>
</html>
