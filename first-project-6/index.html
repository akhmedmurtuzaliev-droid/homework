<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />

		<link
			rel="shortcut icon"
			href="./favicon/nike-favicon-32x32.ico"
			type="image/x-icon"
		/>
		<script src="./js/index.js" type="module"></script>
		<title>Nike Air mag</title>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<a href="#" class="logo header__logo">
					<img
						class="logo__img"
						src="./icons/logo-icon.svg"
						width="50"
						height="20"
						alt="логотип найки"
					/>
				</a>
				<nav
					class="menu header__menu"
					id="header__menu"
					aria-label="главное меню"
				>
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#air-mag" class="menu__link" lang="en">Air Mag</a>
						</li>
						<li class="menu__item">
							<a href="#sizes" class="menu__link">Размеры</a>
						</li>
						<li class="menu__item">
							<a href="#characteristics" class="menu__link">Характеристики</a>
						</li>
						<li class="menu__item">
							<a href="#top-models" class="menu__link">Другие ТОП Модели</a>
						</li>
					</ul>
				</nav>
				<div class="header__controls">
					<a href="#" class="header__order">Сделать заказ</a>
					<div class="header__actions">
						<button
							class="header__actions-button"
							title="поиск"
							aria-label="поиск"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/sprite.svg#search"
								></use>
							</svg>
						</button>
						<button
							class="header__actions-button"
							title="корзина"
							aria-label="корзина"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/sprite.svg#cart"
								></use>
							</svg>
						</button>
						<button
							class="header__burger burger"
							aria-label="Открыть меню"
							aria-expanded="false"
							aria-controls="header__menu"
						>
							<svg width="24" height="24">
								<use
									class="burger__icon-menu"
									href="./icons/sprite.svg#menu-burger"
								></use>
								<use
									class="burger__icon-cross"
									href="./icons/sprite.svg#menu-cross"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="hero">
				<div class="container hero__container">
					<header class="hero__header">
						<ul class="hero__benefits-list">
							<li class="hero__benefits-item">стиль</li>
							<li class="hero__benefits-item">скорость</li>
						</ul>
						<h1 class="hero__title">
							NIKE <span class="hero__title-accent">AIR</span> MAG
						</h1>
					</header>
					<img
						class="hero__img"
						src="./images/nike-air-mag-1img.png"
						width="846"
						height="713"
						alt="кросовок nike air mag с балоном подошвой и под кросовком желтый круг"
					/>
					<footer class="hero__footer">
						<a class="hero__details" href="#">
							Подробнее
							<svg width="24" height="24">
								<use
									class="hero__details-icon"
									href="./icons/main.sprite.svg#arrow-right"
								></use>
							</svg>
						</a>
					</footer>
				</div>
			</section>
		</main>
	</body>
</html>
